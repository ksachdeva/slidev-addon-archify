name: Publish addon to npm

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm (leave unchecked to preview package contents)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.repository == 'ksachdeva/slidev-addon-archify'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Preview package contents
        run: npm pack --dry-run
      - name: Publish to npm with trusted publishing
        if: inputs.publish
        run: npm publish --access public
